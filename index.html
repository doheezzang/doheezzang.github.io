const DrugCalcCard = ({ drug, weight }) => {
  const [dose, setDose] = useState(0);
  const [amount, setAmount] = useState(drug.defaultAmount);
  const [vol, setVol] = useState(drug.defaultVol);
  const calculateInfusion = () => {
    const w = Number(weight) || 0;
    const d = Number(dose) || 0;
    const a = Number(amount) || 0;
    const v = Number(vol) || 1;
    let conc_mcg = 0;
    let conc_mg = 0;
    let conc_u = 0;
    if (drug.defaultAmountUnit === "mg") {
      conc_mcg = a * 1e3 / v;
      conc_mg = a / v;
    } else if (drug.defaultAmountUnit === "mcg") {
      conc_mcg = a / v;
    } else if (drug.defaultAmountUnit === "U") {
      conc_u = a / v;
    }
    if (drug.doseUnit === "mcg/kg/min") {
      return conc_mcg > 0 ? d * w * 60 / conc_mcg : 0;
    } else if (drug.doseUnit === "mg/kg/hr") {
      return conc_mg > 0 ? d * w / conc_mg : 0;
    } else if (drug.doseUnit === "mcg/kg/hr") {
      return conc_mcg > 0 ? d * w / conc_mcg : 0;
    } else if (drug.doseUnit === "U/min") {
      return conc_u > 0 ? d * 60 / conc_u : 0;
    }
    return 0;
  };
  const mlPerHour = calculateInfusion();
  const isOverDose = dose > drug.maxAlert;
  const currentUnitValue = () => {
    const a = Number(amount) || 0;
    const v = Number(vol) || 1;
    if (drug.defaultAmountUnit === "mg") {
      return `${(a * 1e3 / v).toFixed(1)} mcg/mL`;
    }
    return `${(a / v).toFixed(1)} ${drug.defaultAmountUnit}/mL`;
  };
  return <div className="bg-white rounded-2xl p-4 border border-pink-200/90 shadow-sm transition-all hover:border-pink-300">
      <div className="flex justify-between items-start mb-3">
        <div>
          <h3 className="font-bold text-lg text-slate-900">
            {drug.name} <span className="text-sm text-slate-500 font-normal ml-1">{drug.nameKr}</span>
          </h3>
          <div className="mt-1 flex gap-2">
            <span className={`text-[10px] px-2 py-0.5 rounded-full bg-pink-50/70 border border-pink-200 font-medium ${drug.color}`}>
              {drug.type}
            </span>
            {drug.badge && <span className="text-[10px] px-2 py-0.5 rounded-full bg-red-50 text-red-600 border border-red-200 font-bold">
                {drug.badge}
              </span>}
          </div>
        </div>
      </div>

      <div className="bg-pink-50/30 rounded-xl p-3 mb-4 text-sm flex flex-wrap justify-between items-center gap-2 border border-pink-200">
        <div className="flex items-center gap-1">
          <span className="text-slate-500 mr-1 font-medium">조성:</span>
          <input
    type="number"
    className="bg-white w-14 text-center font-semibold text-rose-600 border border-pink-200 rounded px-1 py-0.5 focus:outline-none focus:ring-1 focus:ring-rose-400"
    value={amount}
    onChange={(e) => setAmount(e.target.value)}
  />
          <span className="text-slate-600 text-xs">{drug.defaultAmountUnit}</span>
          <span className="text-slate-400 mx-1">/</span>
          <input
    type="number"
    className="bg-white w-16 text-center font-semibold text-rose-600 border border-pink-200 rounded px-1 py-0.5 focus:outline-none focus:ring-1 focus:ring-rose-400"
    value={vol}
    onChange={(e) => setVol(e.target.value)}
  />
          <span className="text-slate-600 text-xs">mL</span>
        </div>
        <div className="text-xs text-slate-600 bg-white px-2 py-1 rounded border border-pink-200 font-medium">
          = {currentUnitValue()}
        </div>
      </div>

      <div className="flex justify-between items-center bg-pink-50/20 p-3 rounded-xl border border-pink-100">
        <div className="flex flex-col">
          <label className="text-xs text-slate-500 mb-1 font-medium">처방 용량 ({drug.doseUnit})</label>
          <div className="flex items-center gap-2">
            <button
    className="w-8 h-8 rounded-full bg-pink-100 flex items-center justify-center hover:bg-pink-200 text-rose-700 font-bold transition-colors cursor-pointer"
    onClick={() => setDose(Math.max(0, Number((dose - drug.step).toFixed(3))))}
  >
              -
            </button>
            <input
    type="number"
    step={drug.step}
    value={dose}
    onChange={(e) => setDose(parseFloat(e.target.value) || 0)}
    className="w-16 bg-transparent text-center text-xl font-bold focus:outline-none text-slate-900 border-b border-pink-300"
  />
            <button
    className="w-8 h-8 rounded-full bg-pink-100 flex items-center justify-center hover:bg-pink-200 text-rose-700 font-bold transition-colors cursor-pointer"
    onClick={() => setDose(Number((dose + drug.step).toFixed(3)))}
  >

        <div className="text-right flex flex-col items-end">
