const GttCalc = () => {
  const [vol, setVol] = useState(1e3);
  const [hours, setHours] = useState(24);
  const [mins, setMins] = useState(0);
  const [dropFactor, setDropFactor] = useState(20);
  const totalMins = (Number(hours) || 0) * 60 + (Number(mins) || 0);
  const gtt = totalMins > 0 ? (Number(vol) || 0) * dropFactor / totalMins : 0;
  const secPerDrop = gtt > 0 ? 60 / gtt : 0;
  return <div className="space-y-4 px-4 pb-4 animate-fade-in">
      <div className="bg-white rounded-2xl p-5 border border-pink-200 shadow-sm">
        <div className="mb-4">
          <label className="text-sm text-slate-500 mb-2 block font-medium">총 수액 용량 (mL)</label>
          <input
    type="number"
    value={vol}
    onChange={(e) => setVol(e.target.value)}
    className="w-full bg-pink-50/20 border border-pink-200 rounded-xl px-4 py-3 text-lg font-bold focus:outline-none focus:border-rose-400 text-slate-900"
  />
        </div>
        <div className="mb-4 grid grid-cols-2 gap-4">
          <div>
            <label className="text-sm text-slate-500 mb-2 block font-medium">투여 시간 (시간)</label>
            <input
    type="number"
    value={hours}
    onChange={(e) => setHours(e.target.value)}
    className="w-full bg-pink-50/20 border border-pink-200 rounded-xl px-4 py-3 text-lg font-bold focus:outline-none focus:border-rose-400 text-slate-900"
  />
          </div>
          <div>
            <label className="text-sm text-slate-500 mb-2 block font-medium">투여 시간 (분)</label>
            <input
    type="number"
    value={mins}
    onChange={(e) => setMins(e.target.value)}
    className="w-full bg-pink-50/20 border border-pink-200 rounded-xl px-4 py-3 text-lg font-bold focus:outline-none focus:border-rose-400 text-slate-900"
  />
          </div>
        </div>
        <div>
          <label className="text-sm text-slate-500 mb-2 block font-medium">수액 세트 규격 (Drop Factor)</label>
          <div className="grid grid-cols-3 gap-2">
            {[15, 20, 60].map((factor) => <button
    key={factor}
    onClick={() => setDropFactor(factor)}

  >
                {factor} gtt/mL {factor === 60 ? "(Micro)" : "(Macro)"}
              </button>)}
          </div>
        </div>
      </div>

      <div className="bg-gradient-to-br from-pink-50 via-rose-50/40 to-white rounded-2xl p-6 border border-pink-200 text-center shadow-sm">

        <div className="text-5xl font-black text-rose-950 mb-4">

const DrugCalcCard = ({ drug, weight }) => {
  const [dose, setDose] = useState(0);

  const calculateInfusion = () => {
    const w = Number(weight) || 0;
    const d = Number(dose) || 0;
    const a = Number(amount) || 0;
    const v = Number(vol) || 1;
    let conc_mcg = 0;
    let conc_mg = 0;
    let conc_u = 0;
    if (drug.defaultAmountUnit === "mg") {
      conc_mcg = a * 1e3 / v;
      conc_mg = a / v;
    } else if (drug.defaultAmountUnit === "mcg") {
      conc_mcg = a / v;
    } else if (drug.defaultAmountUnit === "U") {
      conc_u = a / v;
    }
    if (drug.doseUnit === "mcg/kg/min") {
      return conc_mcg > 0 ? d * w * 60 / conc_mcg : 0;
    } else if (drug.doseUnit === "mg/kg/hr") {
      return conc_mg > 0 ? d * w / conc_mg : 0;
    } else if (drug.doseUnit === "mcg/kg/hr") {
      return conc_mcg > 0 ? d * w / conc_mcg : 0;
    } else if (drug.doseUnit === "U/min") {
      return conc_u > 0 ? d * 60 / conc_u : 0;
    }
    return 0;
  };
  const mlPerHour = calculateInfusion();
  const isOverDose = dose > drug.maxAlert;
  const currentUnitValue = () => {

              {drug.type}

    className="bg-white w-14 text-center font-semibold text-rose-600 border border-pink-200 rounded px-1 py-0.5 focus:outline-none focus:ring-1 focus:ring-rose-400"
    value={amount}
    onChange={(e) => setAmount(e.target.value)}
  />
          <span className="text-slate-600 text-xs">{drug.defaultAmountUnit}</span>
          <span className="text-slate-400 mx-1">/</span>
          <input
    type="number"
    className="bg-white w-16 text-center font-semibold text-rose-600 border border-pink-200 rounded px-1 py-0.5 focus:outline-none focus:ring-1 focus:ring-rose-400"
    value={vol}

  />
          <span className="text-slate-600 text-xs">mL</span>

        <div className="text-xs text-slate-600 bg-white px-2 py-1 rounded border border-pink-200 font-medium">
